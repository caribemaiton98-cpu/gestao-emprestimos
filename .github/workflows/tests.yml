name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Executar testes
        run: python -m pytest -v